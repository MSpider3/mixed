name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ────────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cargo

          # ── macOS Intel ─────────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            runner: macos-latest
            tool: cargo

          # ── macOS Apple Silicon ─────────────────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-latest
            tool: cargo

          # ── Windows x86_64 ──────────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            tool: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Install Linux audio dev libraries for native linux builds
      - name: Install Linux audio dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            pkg-config \
            libdbus-1-dev

      - name: Build (cargo)
        run: cargo build --release --target ${{ matrix.target }}

      # Determine binary extension (.exe on Windows, none elsewhere)
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/mixed"
          ARCHIVE="mixed-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname $BINARY)" "$(basename $BINARY)"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/mixed.exe"
          $archive = "mixed-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          echo "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixed-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate Release Notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/^## \\[$VERSION\\]/,/^---/p" CHANGELOG.md | sed '$d' > release_notes.md || true

          if [ ! -s release_notes.md ]; then
            echo "## mixed $GITHUB_REF_NAME" > release_notes.md
          fi

          printf "\n---\n\n### 📦 Downloads\n\n| Platform | Archive |\n|---|---|\n| **Linux (x86_64)** | \`mixed-*-x86_64-unknown-linux-gnu.tar.gz\` |\n| **macOS (Apple Silicon)** | \`mixed-*-aarch64-apple-darwin.tar.gz\` |\n| **macOS (Intel)** | \`mixed-*-x86_64-apple-darwin.tar.gz\` |\n| **Windows (x86_64)** | \`mixed-*-x86_64-pc-windows-msvc.zip\` |\n" >> release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: mixed ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/**/*
          body_path: release_notes.md
          generate_release_notes: true
