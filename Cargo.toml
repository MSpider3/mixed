[package]
name = "mixed"
version = "1.7.0"
edition = "2021"
description = "A next-generation terminal music player written in Rust"
license = "GPL-3.0"

[lib]
name = "mixed"
path = "src/lib.rs"

[[bin]]
name = "mixed"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-image = { version = "4", features = ["crossterm"] }
unicode-width = "0.2"

# Audio decoding & playback (Symphonia, Rodio, RustFFT)
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rustfft = "6"

# DSP / Visualization
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"

# Metadata / Tags
lofty = "0.22"
libc = "0.2"

# Filesystem
walkdir = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XDG directories
directories = "6"

# Image processing (cover art)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Signal handling
ctrlc = "3"

# Fuzzy search
fuzzy-matcher = "0.3"
regex = "1"

# Parallel iterators for library scanning
rayon = "1"
# Async Network Runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "fs", "io-util", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
ytmapi-rs = { version = "0.3", optional = true }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"], optional = true }
open = { version = "5", optional = true }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"], optional = true }

rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
log = "0.4.34"

[features]
default = ["spotify", "youtube"]
spotify = ["dep:reqwest", "dep:librespot-core", "dep:librespot-playback", "dep:oauth2", "dep:open", "dep:librespot-metadata", "dep:rustls"]
youtube = ["dep:reqwest", "dep:ytmapi-rs"]

[[example]]
name = "spike_spotify"
required-features = ["spotify"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Linux-only: D-Bus/MPRIS stack (playerctl, GNOME media controls)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
enumflags2 = "0.7"

